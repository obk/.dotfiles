<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Use Lilex (IBM Plex Mono + ligatures, Nerd Font build) for every generic monospace request -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Lilex Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
